---
- name: Set domain-specific paths
  ansible.builtin.set_fact:
    cert_file: "/etc/ssl/certs/{{ domain.name }}.crt"
    key_file: "/etc/ssl/private/{{ domain.name }}.pem"
    script_path: "/usr/local/bin/step-ca-cert-renewer-{{ domain.name }}.sh"
    service_path: "/etc/systemd/system/step-ca-cert-renewer@{{ domain.name }}.service"
    timer_path: "/etc/systemd/system/step-ca-cert-renewer@{{ domain.name }}.timer"
    timer_name: "step-ca-cert-renewer@{{ domain.name }}.timer"

- name: Verify certificate file exists for {{ domain.name }}
  ansible.builtin.stat:
    path: "{{ cert_file }}"
  register: cert_stat

- name: Assert certificate file exists for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - cert_stat.stat.exists
    fail_msg: "Certificate file {{ cert_file }} does not exist"

- name: Verify private key file exists for {{ domain.name }}
  ansible.builtin.stat:
    path: "{{ key_file }}"
  register: key_stat

- name: Assert private key file exists for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - key_stat.stat.exists
    fail_msg: "Private key file {{ key_file }} does not exist"

- name: Get certificate validity period for {{ domain.name }}
  ansible.builtin.command:
    cmd: step certificate inspect {{ cert_file }} --format json
  register: cert_info
  changed_when: false

- name: Parse certificate validity for {{ domain.name }}
  ansible.builtin.set_fact:
    cert_not_before: "{{ (cert_info.stdout | from_json).validity.start }}"
    cert_not_after: "{{ (cert_info.stdout | from_json).validity.end }}"

- name: Calculate certificate validity duration in hours for {{ domain.name }}
  ansible.builtin.set_fact:
    cert_validity_seconds: >-
      {{ ((cert_not_after | to_datetime('%Y-%m-%dT%H:%M:%SZ')) -
          (cert_not_before | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() | int }}

- name: Assert certificate validity is approximately 168 hours (7 days) for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - cert_validity_seconds | int >= 601200
      - cert_validity_seconds | int <= 608400
    fail_msg: "Certificate validity is {{ cert_validity_seconds | int // 3600 }} hours, expected ~168 hours"

- name: Verify step-ca-cert-renewer script exists for {{ domain.name }}
  ansible.builtin.stat:
    path: "{{ script_path }}"
  register: script_stat

- name: Assert step-ca-cert-renewer script is executable for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - script_stat.stat.exists
      - script_stat.stat.mode == '0755'
    fail_msg: "step-ca-cert-renewer script {{ script_path }} is missing or not executable"

- name: Read step-ca-cert-renewer script for {{ domain.name }}
  ansible.builtin.slurp:
    src: "{{ script_path }}"
  register: script_content

- name: Assert correct cert paths in script for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - "cert_file in (script_content.content | b64decode)"
      - "key_file in (script_content.content | b64decode)"
    fail_msg: "Script {{ script_path }} does not contain correct cert paths"

- name: Verify step-ca-cert-renewer service file exists for {{ domain.name }}
  ansible.builtin.stat:
    path: "{{ service_path }}"
  register: service_stat

- name: Assert step-ca-cert-renewer service file exists for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - service_stat.stat.exists
    fail_msg: "{{ service_path }} does not exist"

- name: Read step-ca-cert-renewer service file for {{ domain.name }}
  ansible.builtin.slurp:
    src: "{{ service_path }}"
  register: service_content

- name: Assert service calls correct script for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - "script_path in (service_content.content | b64decode)"
    fail_msg: "Service does not call correct script {{ script_path }}"

- name: Read step-ca-cert-renewer timer file for {{ domain.name }}
  ansible.builtin.slurp:
    src: "{{ timer_path }}"
  register: timer_content

- name: Assert timer schedule is configured correctly for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - "'OnCalendar=*:0/10' in (timer_content.content | b64decode)"
    fail_msg: "Timer schedule not configured correctly in {{ timer_path }}"

- name: Verify step-ca-cert-renewer timer is enabled for {{ domain.name }}
  ansible.builtin.systemd:
    name: "{{ timer_name }}"
  register: timer_status

- name: Assert step-ca-cert-renewer timer is enabled for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - timer_status.status.UnitFileState == 'enabled'
    fail_msg: "{{ timer_name }} is not enabled"

- name: Verify post-renewal marker file was created for {{ domain.name }}
  ansible.builtin.stat:
    path: "{{ domain.marker_file }}"
  register: marker_stat

- name: Assert post-command was executed during initial certificate creation for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - marker_stat.stat.exists
    fail_msg: "Post-command was not executed during initial certificate creation for {{ domain.name }}"

- name: Run step-ca-cert-renewer script when cert is valid for {{ domain.name }}
  ansible.builtin.command:
    cmd: "{{ script_path }}"
  register: script_result
  changed_when: false

- name: Assert script reports cert is valid for {{ domain.name }}
  ansible.builtin.assert:
    that:
      - "'Certificate is valid, no action needed' in script_result.stdout"
    fail_msg: "Script should report cert is valid when no action needed"
